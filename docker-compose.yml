version: '3.8'

services:
  bottegadakris_mysql:
    image: mariadb:10.11
    container_name: siegeventure_bottegadakris
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: siegeventure_bottegadakris
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
